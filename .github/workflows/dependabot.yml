version: 2
updates:
  - package-ecosystem: "nuget"            # NuGet packages in .csproj files
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft:                          # one PR for all Microsoft.* bumps
        patterns: [ "Microsoft.*", "System.*" ]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"   # versions in .github/workflows
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"